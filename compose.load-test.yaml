name: ai-media-loadtest

services:
  media:
    build: .
    image: ai-media-web-tg:local
    restart: 'no'
    init: true
    environment:
      MEDIA_HOST: 0.0.0.0
      MEDIA_PORT: 3000
      MEDIA_PUBLIC_ORIGIN: http://127.0.0.1:3001
      MEDIA_DATA_DIR: data/load-test-service
      MEDIA_AUTH_ENABLED: 'true'
      DATABASE_URL: ${LOAD_TEST_DATABASE_URL:?Pass --env-file .env.load-test}
      DATABASE_SSL: '0'
      MEDIA_DB_POOL_MAX: ${LOAD_TEST_DB_POOL_MAX:-5}
      MEDIA_LOAD_TRACE: ${LOAD_TEST_TRACE:-0}
      MEDIA_STORAGE_DRIVER: local
      MEDIA_PAYMENTS_ENABLED: 'false'
      MEDIA_SALES_ENABLED: 'false'
      MEDIA_CODEX_EMBEDDED: 'false'
      MEDIA_KIE_BROWSER_EMBEDDED: 'false'
      TELEGRAM_ENABLED: 'false'
      KIE_API_KEY: ''
      KIE_API_KEY_2: ''
      ROUTERAI_API_KEY: ''
    ports:
      - '127.0.0.1:3001:3000'
    volumes:
      - ./data/load-test-service:/app/data/load-test-service
    stop_grace_period: 60s

  load:
    profiles: [load]
    image: grafana/k6@sha256:e66db15b860113878fa74670e31f5e274830b7b6e42c8bff28b2f2d86a257603
    depends_on:
      media:
        condition: service_healthy
    entrypoint: [k6]
    environment:
      BASE_URL: http://media:3000
      HOST_HEADER: 127.0.0.1:3001
    volumes:
      - ./tools/load-test:/scripts:ro
      - ./artifacts/load-tests:/results
