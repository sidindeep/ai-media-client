<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Аккаунты · Администратор</title><link rel="stylesheet" href="/web.css"><script src="/admin.js" defer></script></head>
<body class="account-page"><main class="account-card admin-card"><a href="/">← Медиастудия</a><h1>Аккаунты и кредиты</h1><p><a href="/?account=legacy">Прежняя общая история и провайдерские расходы</a></p><p id="adminStatus" role="status"></p><div id="accounts"></div><h2>Пополнение кредитов</h2><p>Начислите кредиты себе или пользователю. Это ручное пополнение, без проведения платежа.</p><button id="grantSelf" type="button">Пополнить мой счёт</button><p id="grantBalance" role="status"></p><form id="grantForm"><label>Аккаунт<select id="grantAccount" required></select></label><label>Кредиты<input id="grantAmount" type="number" min="0.001" step="0.001" required></label><label>Причина<input id="grantNote" maxlength="500" required></label><button>Пополнить</button></form><p>Повтор после сетевой ошибки использует тот же идентификатор операции.</p></main></body></html>
