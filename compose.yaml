name: ai-media-web-tg
services:
  media:
    build: .
    image: ai-media-web-tg:local
    restart: unless-stopped
    init: true
    dns:
      - ${MEDIA_DNS_PRIMARY:-1.1.1.1}
      - ${MEDIA_DNS_SECONDARY:-8.8.8.8}
    env_file:
      - .env
    environment:
      MEDIA_HOST: 0.0.0.0
      MEDIA_PORT: 3000
      MEDIA_DATA_DIR: data/service
      MEDIA_CODEX_URL: http://codex:3210
      MEDIA_CODEX_EMBEDDED: 'false'
      MEDIA_KIE_BROWSER_CDP: http://kie-browser:9222
      MEDIA_KIE_BROWSER_LOGIN_URL: http://127.0.0.1:5808/
      MEDIA_KIE_BROWSER_EMBEDDED: 'false'
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data/service:/app/data/service
    stop_grace_period: 60s
    networks: [default, codex-link]
  kie-browser:
    image: jlesage/chromium@sha256:e42de7469bce122b8a69d4f62101850ece45c41ed7ed952f2b506f99947093ae
    restart: unless-stopped
    environment:
      CHROMIUM_APP_URL: https://kie.ai/api-key
      CHROMIUM_REMOTE_DEBUGGING: '1'
      CHROMIUM_CUSTOM_ARGS: --disable-extensions
      WEB_TERMINAL: '0'
      VNC_LISTENING_PORT: '-1'
    ports:
      - "127.0.0.1:5808:5800"
    volumes:
      - kie-session:/config
    networks: [default]
  codex:
    build:
      context: .
      dockerfile: Dockerfile.codex
    image: ai-media-codex:local
    init: true
    environment:
      MEDIA_CODEX_TRANSPORT: ${MEDIA_CODEX_TRANSPORT:-app-server}
      MEDIA_CODEX_POOL_SIZE: ${MEDIA_CODEX_POOL_SIZE:-2}
      MEDIA_CODEX_PROCESS_CONCURRENCY: ${MEDIA_CODEX_PROCESS_CONCURRENCY:-128}
      MEDIA_CODEX_RPC_TIMEOUT_MS: ${MEDIA_CODEX_RPC_TIMEOUT_MS:-60000}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    volumes:
      - codex-auth:/home/node/.codex
    networks: [codex-link]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3210/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
  tests:
    profiles: [test]
    build:
      context: .
      target: test
    image: ai-media-web-tg-tests:local
    command: [node, --test, test/payments.test.js]
volumes:
  kie-session:
    name: ai-media-kie-session
  codex-auth:
    external: true
    name: ${MEDIA_CODEX_AUTH_VOLUME:-llm-providers_codex-auth}
networks:
  codex-link:
