name: ai-media-web-tg
services:
  media:
    build: .
    image: ai-media-web-tg:local
    restart: unless-stopped
    init: true
    dns:
      - ${MEDIA_DNS_PRIMARY:-1.1.1.1}
      - ${MEDIA_DNS_SECONDARY:-8.8.8.8}
    env_file:
      - .env
    environment:
      MEDIA_HOST: 0.0.0.0
      MEDIA_PORT: 3000
      MEDIA_REPLICA_ROLE: executor
      AI_LOGGER_SERVICE: executor
      MEDIA_DATA_DIR: data/service
      MEDIA_CODEX_URL: http://codex:3210
      MEDIA_CODEX_EMBEDDED: 'false'
      MEDIA_KIE_BROWSER_CDP: http://127.0.0.1:9222
      MEDIA_KIE_BROWSER_LOGIN_URL: ''
      MEDIA_KIE_BROWSER_EMBEDDED: 'true'
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data/service:/app/data/service
      - type: volume
        source: kie-session
        target: /app/data/kie-browser
        volume:
          subpath: chromium
    stop_grace_period: 60s
    networks: [default, codex-link]
  media-web:
    profiles: [replicas]
    build: .
    image: ai-media-web-tg:local
    restart: unless-stopped
    init: true
    depends_on:
      media:
        condition: service_healthy
    env_file:
      - .env
    environment:
      MEDIA_HOST: 0.0.0.0
      MEDIA_PORT: 3000
      MEDIA_REPLICA_ROLE: web
      AI_LOGGER_SERVICE: web
      MEDIA_EXECUTOR_URL: http://media:3000
      MEDIA_PUBLIC_ORIGIN: ${MEDIA_WEB_PUBLIC_ORIGIN:-http://127.0.0.1:3002}
      MEDIA_EXECUTOR_PUBLIC_ORIGIN: ${MEDIA_PUBLIC_ORIGIN:-http://127.0.0.1:3000}
      MEDIA_DATA_DIR: data/service
      MEDIA_DB_POOL_MAX: ${MEDIA_WEB_DB_POOL_MAX:-2}
      MEDIA_CODEX_EMBEDDED: 'false'
      MEDIA_KIE_BROWSER_EMBEDDED: 'false'
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - ./data/service:/app/data/service
    stop_grace_period: 60s
    networks: [default]
  codex:
    build:
      context: .
      dockerfile: Dockerfile.codex
    image: ai-media-codex:local
    init: true
    environment:
      MEDIA_CODEX_TRANSPORT: ${MEDIA_CODEX_TRANSPORT:-app-server}
      MEDIA_CODEX_POOL_SIZE: ${MEDIA_CODEX_POOL_SIZE:-2}
      MEDIA_CODEX_PROCESS_CONCURRENCY: ${MEDIA_CODEX_PROCESS_CONCURRENCY:-128}
      MEDIA_CODEX_RPC_TIMEOUT_MS: ${MEDIA_CODEX_RPC_TIMEOUT_MS:-60000}
      MEDIA_CODEX_RESULT_DIR: /worker/results
      MEDIA_CODEX_MAX_PENDING_JOBS: ${MEDIA_CODEX_MAX_PENDING_JOBS:-256}
      AI_LOGGER_SERVER_URL: ${AI_LOGGER_SERVER_URL:-}
      AI_LOGGER_SERVICE: codex-worker
      MEDIA_PUBLIC_ORIGIN: ${MEDIA_PUBLIC_ORIGIN:-}
      AI_LOGGER_ENVIRONMENT: ${AI_LOGGER_ENVIRONMENT:-production}
      AI_LOGGER_ALLOW_PRIVATE_HTTP: ${AI_LOGGER_ALLOW_PRIVATE_HTTP:-0}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    volumes:
      - codex-auth:/home/node/.codex
      - ./data/codex-results:/worker/results
    networks: [codex-link]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3210/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
  tests:
    profiles: [test]
    build:
      context: .
      target: test
    image: ai-media-web-tg-tests:local
    command: [sh, -c, "pnpm check:server-syntax && pnpm check:async-safety && pnpm check:web:vue && pnpm build:web && pnpm test"]
    environment:
      TEST_DATABASE_URL: postgres://test:test@postgres-test:5432/test
    depends_on:
      postgres-test:
        condition: service_healthy
  browser-tests:
    profiles: [test]
    build:
      context: .
      target: browser-test
    command: [node, test/browser-e2e.cjs]
    environment:
      TEST_DATABASE_URL: postgres://test:test@postgres-test:5432/test
    depends_on:
      postgres-test:
        condition: service_healthy
  postgres-test:
    profiles: [test]
    image: postgres:15
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U test -d test"]
      interval: 2s
      timeout: 2s
      retries: 20
volumes:
  kie-session:
    name: ai-media-kie-session
  codex-auth:
    name: ${MEDIA_CODEX_AUTH_VOLUME:-ai-media-codex-auth}
networks:
  codex-link:
